<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Barber Motion Atlas v4</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f2f0e9}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;z-index:5;background:#171717;color:#fff;padding:12px 14px 10px}.title{font-weight:800;letter-spacing:.06em;font-size:17px}.sub{font-size:11px;opacity:.7;margin-top:2px}.search{width:100%;margin-top:10px;padding:11px 12px;border:0;border-radius:9px;font-size:16px}.controls{display:flex;gap:7px;overflow:auto;padding:9px 0 1px}.chip,.sync{white-space:nowrap;border:1px solid #666;background:#282828;color:#fff;border-radius:999px;padding:6px 10px;font-size:12px}.chip.on{background:#fff;color:#111}.sync.good{border-color:#aaa}.count{padding:10px 14px 4px;font-size:12px;color:#666}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px}@media(min-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}.card{background:#fff;border-radius:11px;overflow:hidden;box-shadow:0 1px 5px #0002;cursor:pointer}.card img{width:100%;display:block;aspect-ratio:3/4;object-fit:contain;background:#fff}.meta{padding:8px}.pn{font-weight:800;font-size:14px}.cat{font-size:11px;line-height:1.25;color:#555;margin-top:4px}.hit{font-size:10px;line-height:1.25;color:#333;margin-top:5px;border-top:1px solid #eee;padding-top:5px}.modal{display:none;position:fixed;inset:0;background:#111;z-index:20;color:#fff;overflow:auto}.modal.on{display:block}.bar{position:sticky;top:0;background:#111e;padding:10px;display:flex;align-items:center;gap:10px;z-index:2}.bar button{font-size:18px;background:#333;color:#fff;border:0;border-radius:8px;padding:7px 12px}.bar .grow{flex:1}.fullimg{width:100%;max-height:70vh;object-fit:contain;background:#fff}.detail{padding:14px 16px 30px}.detail h2{margin:0 0 8px}.badge{display:inline-block;border:1px solid #777;border-radius:999px;padding:5px 9px;margin:3px 4px 3px 0;font-size:12px}.mech{border-top:1px solid #444;padding:9px 0;font-size:13px;line-height:1.35}.nums{font-weight:800;color:#ddd}.empty{text-align:center;padding:50px 20px;color:#777}.status{font-size:11px;opacity:.75;padding-top:5px}.source{color:#fff}.atlasbox{margin:8px 0 12px;padding:9px;border:1px solid #666;border-radius:9px;background:#1b1b1b}.atlaslabel{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#aaa;margin-top:7px}.atag{display:inline-block;background:#333;border-radius:999px;padding:4px 7px;margin:3px 3px 0 0;font-size:11px}.atlasnote{font-size:10px;color:#aaa;margin-top:8px}.designhit{font-size:10px;color:#222;background:#eee;padding:5px;margin-top:5px;border-radius:5px}.filterrow{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}.filterrow select{width:100%;padding:8px 10px;border:1px solid #666;border-radius:8px;background:#282828;color:#fff;font-size:12px}.filterrow select:disabled{opacity:.55}@media(min-width:700px){.filterrow{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<div class="top"><div class="title">BARBER MOTION ATLAS <small>v4.1</small></div><div class="sub">The Engineer’s Sketch-Book · 156 plates</div><input id="q" class="search" placeholder="Search Barber text, motion, purpose, behavior…"><div class="filterrow"><select id="motionFilter"><option value="">Motion — any</option></select><select id="purposeFilter"><option value="">Purpose — any</option></select><select id="behaviorFilter"><option value="">Behavior / constraint — any</option></select></div><div class="controls"><button class="chip on" data-part="0">All</button><button class="chip" data-part="1">Part I</button><button class="chip" data-part="2">Part II</button><span class="sync good">Barber text: local</span><button id="designOnly" class="chip">Motion-tagged</button></div><div id="status" class="status"></div></div><div id="count" class="count"></div><main id="grid" class="grid"></main>
<div id="modal" class="modal"><div class="bar"><button id="close">×</button><button id="prev">‹</button><div id="mt" class="grow"></div><button id="next">›</button></div><img id="fullimg" class="fullimg"><div id="detail" class="detail"></div></div>
<script src="data.js"></script><script>
const SOURCE='https://www.gutenberg.org/ebooks/58391';
const P=BARBER_DATA.plates,g=document.querySelector('#grid'),q=document.querySelector('#q'),count=document.querySelector('#count'),status=document.querySelector('#status'),motionFilter=document.querySelector('#motionFilter'),purposeFilter=document.querySelector('#purposeFilter'),behaviorFilter=document.querySelector('#behaviorFilter');let part=0,current=null,MECH={},ATLAS={};let designOnly=false;
function mechCount(){return Object.values(MECH).reduce((n,a)=>n+a.length,0)}
function setStatus(msg){status.textContent=msg||(mechCount()?`${mechCount()} Barber description blocks stored with this site. Search includes the local source text.`:'Local Barber description index not found.');}
function baseText(p){return (`plate ${p.plate} part ${p.part} page ${p.printed_page} `+p.categories.map(c=>`section ${c.section} ${c.title}`).join(' ')).toLowerCase()}
function mechText(p){return (MECH[p.plate]||[]).map(x=>`${x.numbers.join(' ')} ${x.text}`).join(' ').toLowerCase()}
function atlasForPlate(p){return Object.values(ATLAS).filter(x=>x.plate===p.plate)}
function atlasText(p){return atlasForPlate(p).map(x=>[...(x.motion||[]),...(x.purpose||[]),...(x.behavior||[])].join(' ')).join(' ').toLowerCase()}
function atlasSnippet(p,s){if(!s)return'';let a=atlasForPlate(p).find(x=>[...(x.motion||[]),...(x.purpose||[]),...(x.behavior||[])].join(' ').toLowerCase().includes(s));return a?`<div class="designhit"><b>Motion Atlas:</b> ${esc([...(a.motion||[]),...(a.purpose||[]),...(a.behavior||[])].join(' · '))}</div>`:''}
function matchedSnippet(p,s){if(!s)return'';let x=(MECH[p.plate]||[]).find(x=>(x.numbers.join(' ')+' '+x.text).toLowerCase().includes(s));return x?`<div class="hit"><b>${x.numbers.join(', ')}</b> ${esc(x.text).slice(0,150)}</div>`:''}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function plateMatchesFilters(p){const entries=atlasForPlate(p),m=motionFilter.value,pu=purposeFilter.value,b=behaviorFilter.value;return (!m||entries.some(x=>(x.motion||[]).includes(m)))&&(!pu||entries.some(x=>(x.purpose||[]).includes(pu)))&&(!b||entries.some(x=>(x.behavior||[]).includes(b)))}
function render(){let s=q.value.trim().toLowerCase();let a=P.filter(p=>(!part||p.part===part)&&(!designOnly||atlasForPlate(p).length)&&plateMatchesFilters(p)&&(!s||baseText(p).includes(s)||mechText(p).includes(s)||atlasText(p).includes(s)));count.textContent=`${a.length} plate${a.length===1?'':'s'}`;g.innerHTML=a.length?a.map(p=>`<article class="card" onclick="openP(${p.plate})"><img loading="lazy" src="${p.image}"><div class="meta"><div class="pn">Plate ${p.plate}</div><div class="cat">${p.categories.map(c=>esc(c.title)).join(' · ')||'Uncategorized'}</div>${matchedSnippet(p,s)}${atlasSnippet(p,s)}</div></article>`).join(''):'<div class="empty">No matching plates.</div>'}
q.oninput=render;[motionFilter,purposeFilter,behaviorFilter].forEach(x=>x.onchange=render);document.querySelector('#designOnly').onclick=()=>{designOnly=!designOnly;document.querySelector('#designOnly').classList.toggle('on',designOnly);render()};document.querySelectorAll('.chip[data-part]').forEach(b=>b.onclick=()=>{part=+b.dataset.part;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));render()});
const m=document.querySelector('#modal');function openP(n){let p=P[n-1];current=n;document.querySelector('#mt').textContent=`Plate ${n}`;document.querySelector('#fullimg').src=p.image;let mm=MECH[n]||[];document.querySelector('#detail').innerHTML=`<h2>Plate ${n}</h2><div>Part ${p.part===1?'I':'II'} · printed page ${p.printed_page}</div><p>${p.categories.map(c=>`<span class="badge">§${c.section} ${esc(c.title)}</span>`).join('')}</p>${atlasForPlate(p).length?`<h3>Motion Atlas pilot tags</h3>${atlasForPlate(p).map(a=>`<div class="atlasbox"><b>${a.numbers.join(', ')}</b><div class="atlaslabel">Motion</div>${a.motion.map(t=>`<span class="atag">${esc(t)}</span>`).join('')}<div class="atlaslabel">Use when you need to…</div>${a.purpose.map(t=>`<span class="atag">${esc(t)}</span>`).join('')}<div class="atlaslabel">Behavior / constraint</div>${a.behavior.map(t=>`<span class="atag">${esc(t)}</span>`).join('')}</div>`).join('')}<div class="atlasnote">Motion Atlas tags are our interpretive design index; Barber's original wording below remains source-faithful.</div>`:''}${mm.length?`<h3>Barber descriptions</h3>${mm.map(x=>`<div class="mech"><span class="nums">${x.numbers.join(', ')}</span> ${esc(x.text)}</div>`).join('')}`:`<p>No cached descriptions for this plate yet.</p>`}<p><a class="source" href="${SOURCE}" target="_blank">Open Gutenberg source</a></p>`;m.classList.add('on');location.hash='plate'+n}window.openP=openP;document.querySelector('#close').onclick=()=>{m.classList.remove('on');history.replaceState(null,'',location.pathname)};document.querySelector('#prev').onclick=()=>openP(current===1?156:current-1);document.querySelector('#next').onclick=()=>openP(current===156?1:current+1);
document.addEventListener('keydown',e=>{if(!m.classList.contains('on'))return;if(e.key==='Escape')document.querySelector('#close').click();if(e.key==='ArrowLeft')document.querySelector('#prev').click();if(e.key==='ArrowRight')document.querySelector('#next').click()});function populateFilters(){const vals=k=>[...new Set(Object.values(ATLAS).flatMap(x=>x[k]||[]))].sort((a,b)=>a.localeCompare(b));[[motionFilter,'motion'],[purposeFilter,'purpose'],[behaviorFilter,'behavior']].forEach(([el,k])=>{vals(k).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o)});el.disabled=vals(k).length===0})}async function init(){try{const ar=await fetch('atlas-tags.json');if(ar.ok){const ad=await ar.json();ATLAS=ad.entries||{};populateFilters()}}catch(e){}try{const r=await fetch('mechanisms.json');if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();MECH=d.plates||d;setStatus();}catch(e){setStatus('Local mechanisms.json not found yet; plate/category browser remains available.');}render();let h=location.hash.match(/plate(\d+)/);if(h)openP(+h[1]);}init();
</script></body></html>
