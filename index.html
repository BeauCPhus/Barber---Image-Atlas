<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Barber Motion Atlas v2</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f2f0e9}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;z-index:5;background:#171717;color:#fff;padding:12px 14px 10px}.title{font-weight:800;letter-spacing:.06em;font-size:17px}.sub{font-size:11px;opacity:.7;margin-top:2px}.search{width:100%;margin-top:10px;padding:11px 12px;border:0;border-radius:9px;font-size:16px}.controls{display:flex;gap:7px;overflow:auto;padding:9px 0 1px}.chip,.sync{white-space:nowrap;border:1px solid #666;background:#282828;color:#fff;border-radius:999px;padding:6px 10px;font-size:12px}.chip.on{background:#fff;color:#111}.sync.good{border-color:#aaa}.count{padding:10px 14px 4px;font-size:12px;color:#666}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px}@media(min-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}.card{background:#fff;border-radius:11px;overflow:hidden;box-shadow:0 1px 5px #0002;cursor:pointer}.card img{width:100%;display:block;aspect-ratio:3/4;object-fit:contain;background:#fff}.meta{padding:8px}.pn{font-weight:800;font-size:14px}.cat{font-size:11px;line-height:1.25;color:#555;margin-top:4px}.hit{font-size:10px;line-height:1.25;color:#333;margin-top:5px;border-top:1px solid #eee;padding-top:5px}.modal{display:none;position:fixed;inset:0;background:#111;z-index:20;color:#fff;overflow:auto}.modal.on{display:block}.bar{position:sticky;top:0;background:#111e;padding:10px;display:flex;align-items:center;gap:10px;z-index:2}.bar button{font-size:18px;background:#333;color:#fff;border:0;border-radius:8px;padding:7px 12px}.bar .grow{flex:1}.fullimg{width:100%;max-height:70vh;object-fit:contain;background:#fff}.detail{padding:14px 16px 30px}.detail h2{margin:0 0 8px}.badge{display:inline-block;border:1px solid #777;border-radius:999px;padding:5px 9px;margin:3px 4px 3px 0;font-size:12px}.mech{border-top:1px solid #444;padding:9px 0;font-size:13px;line-height:1.35}.nums{font-weight:800;color:#ddd}.empty{text-align:center;padding:50px 20px;color:#777}.status{font-size:11px;opacity:.75;padding-top:5px}.source{color:#fff}
</style></head><body>
<div class="top"><div class="title">BARBER MOTION ATLAS <small>v3</small></div><div class="sub">The Engineer’s Sketch-Book · 156 plates</div><input id="q" class="search" placeholder="Search plate, category, mechanism number or description…"><div class="controls"><button class="chip on" data-part="0">All</button><button class="chip" data-part="1">Part I</button><button class="chip" data-part="2">Part II</button><span class="sync good">Barber text: local</span></div><div id="status" class="status"></div></div><div id="count" class="count"></div><main id="grid" class="grid"></main>
<div id="modal" class="modal"><div class="bar"><button id="close">×</button><button id="prev">‹</button><div id="mt" class="grow"></div><button id="next">›</button></div><img id="fullimg" class="fullimg"><div id="detail" class="detail"></div></div>
<script src="data.js"></script><script>
const SOURCE='https://www.gutenberg.org/ebooks/58391';
const P=BARBER_DATA.plates,g=document.querySelector('#grid'),q=document.querySelector('#q'),count=document.querySelector('#count'),status=document.querySelector('#status');let part=0,current=null,MECH={};
function mechCount(){return Object.values(MECH).reduce((n,a)=>n+a.length,0)}
function setStatus(msg){status.textContent=msg||(mechCount()?`${mechCount()} Barber description blocks stored with this site. Search includes the local source text.`:'Local Barber description index not found.');}
function baseText(p){return (`plate ${p.plate} part ${p.part} page ${p.printed_page} `+p.categories.map(c=>`section ${c.section} ${c.title}`).join(' ')).toLowerCase()}
function mechText(p){return (MECH[p.plate]||[]).map(x=>`${x.numbers.join(' ')} ${x.text}`).join(' ').toLowerCase()}
function matchedSnippet(p,s){if(!s)return'';let x=(MECH[p.plate]||[]).find(x=>(x.numbers.join(' ')+' '+x.text).toLowerCase().includes(s));return x?`<div class="hit"><b>${x.numbers.join(', ')}</b> ${esc(x.text).slice(0,150)}</div>`:''}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let s=q.value.trim().toLowerCase();let a=P.filter(p=>(!part||p.part===part)&&(!s||baseText(p).includes(s)||mechText(p).includes(s)));count.textContent=`${a.length} plate${a.length===1?'':'s'}`;g.innerHTML=a.length?a.map(p=>`<article class="card" onclick="openP(${p.plate})"><img loading="lazy" src="${p.image}"><div class="meta"><div class="pn">Plate ${p.plate}</div><div class="cat">${p.categories.map(c=>esc(c.title)).join(' · ')||'Uncategorized'}</div>${matchedSnippet(p,s)}</div></article>`).join(''):'<div class="empty">No matching plates.</div>'}
q.oninput=render;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{part=+b.dataset.part;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));render()});
const m=document.querySelector('#modal');function openP(n){let p=P[n-1];current=n;document.querySelector('#mt').textContent=`Plate ${n}`;document.querySelector('#fullimg').src=p.image;let mm=MECH[n]||[];document.querySelector('#detail').innerHTML=`<h2>Plate ${n}</h2><div>Part ${p.part===1?'I':'II'} · printed page ${p.printed_page}</div><p>${p.categories.map(c=>`<span class="badge">§${c.section} ${esc(c.title)}</span>`).join('')}</p>${mm.length?`<h3>Barber descriptions</h3>${mm.map(x=>`<div class="mech"><span class="nums">${x.numbers.join(', ')}</span> ${esc(x.text)}</div>`).join('')}`:`<p>No cached descriptions for this plate yet.</p>`}<p><a class="source" href="${SOURCE}" target="_blank">Open Gutenberg source</a></p>`;m.classList.add('on');location.hash='plate'+n}window.openP=openP;document.querySelector('#close').onclick=()=>{m.classList.remove('on');history.replaceState(null,'',location.pathname)};document.querySelector('#prev').onclick=()=>openP(current===1?156:current-1);document.querySelector('#next').onclick=()=>openP(current===156?1:current+1);
document.addEventListener('keydown',e=>{if(!m.classList.contains('on'))return;if(e.key==='Escape')document.querySelector('#close').click();if(e.key==='ArrowLeft')document.querySelector('#prev').click();if(e.key==='ArrowRight')document.querySelector('#next').click()});async function init(){try{const r=await fetch('mechanisms.json');if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();MECH=d.plates||d;setStatus();}catch(e){setStatus('Local mechanisms.json not found yet; plate/category browser remains available.');}render();let h=location.hash.match(/plate(\d+)/);if(h)openP(+h[1]);}init();
</script></body></html>
